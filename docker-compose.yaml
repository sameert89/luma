services:
  luma:
    build: .
    ports:
      - "5080:5080"
    environment:
      Luma__Files__Enabled: "${LUMA_FILES_ENABLED:-false}"
      Luma__Ui__FlickEnabled: "${LUMA_FLICK_ENABLED:-true}"
      Luma__Ui__PanelsEnabled: "${LUMA_PANELS_ENABLED:-true}"
      Luma__Indexing__Libraries__0__Id: "1"
      Luma__Indexing__Libraries__0__Name: "Media"
      Luma__Indexing__Libraries__0__Path: /media
      Luma__Indexing__Libraries__0__CaseSensitive: "${LUMA_CASE_SENSITIVE:-true}"
      Luma__Indexing__Libraries__0__ScanOnStartup: "${LUMA_SCAN_ON_STARTUP:-false}"
    volumes:
      - "${LUMA_MEDIA_PATH:?Set LUMA_MEDIA_PATH in .env to an absolute media directory}:/media:ro"
      - luma-data:/data
    restart: unless-stopped
volumes:
  luma-data:
