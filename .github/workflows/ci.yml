name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Luma.Web/package-lock.json
      - run: dotnet restore Luma.slnx --locked-mode
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        if: runner.os == 'Linux'
      - run: choco install ffmpeg --no-progress -y
        if: runner.os == 'Windows'
      - run: dotnet format Luma.slnx --verify-no-changes --no-restore
      - run: dotnet build Luma.slnx -c Release --no-restore
      - run: dotnet test Luma.slnx -c Release --no-build
      - run: npm ci
        working-directory: src/Luma.Web
      - run: npm run generate:api
        working-directory: src/Luma.Web
      - run: git diff --exit-code -- contracts/luma.json src/Luma.Web/src/lib/api/generated.ts
      - run: npm run format:check
        working-directory: src/Luma.Web
      - run: npm run lint
        working-directory: src/Luma.Web
      - run: npm run build
        working-directory: src/Luma.Web
      - run: npm test
        working-directory: src/Luma.Web
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: src/Luma.Web
      - run: npm run test:e2e
        if: runner.os == 'Linux'
        working-directory: src/Luma.Web
